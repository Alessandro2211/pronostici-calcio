name: Prova fonti dati

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prova le fonti
        run: bash scripts/probe.sh
      - name: Salva il risultato in un ramo a parte
        run: |
          mkdir -p /tmp/out && cp probe-result.md /tmp/out/
          git config user.name "probe"; git config user.email "probe@users.noreply.github.com"
          git checkout --orphan probe-results
          git rm -rf . -q
          cp /tmp/out/probe-result.md .
          git add probe-result.md
          git commit -q -m "Risultato prova fonti"
          git push -f origin probe-results
