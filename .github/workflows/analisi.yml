name: Analisi dati
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analisi:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 analisi/backtest3.py
      - name: Salva
        if: always()
        run: |
          mkdir -p /tmp/out && cp analisi-*.md /tmp/out/ || true
          git config user.name analisi; git config user.email analisi@users.noreply.github.com
          git checkout --orphan analisi-risultati
          git rm -rf . -q
          cp /tmp/out/* . || true
          git add -A; git commit -q -m "blend"; git push -f origin analisi-risultati
