name: Analisi dati

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analisi:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Statistiche per partita di ESPN
        run: python3 analisi/espn_check.py
      - name: Prova a ritroso
        run: python3 analisi/hfa.py
      - name: Salva i risultati in un ramo a parte
        if: always()
        run: |
          mkdir -p /tmp/out && cp analisi-*.md /tmp/out/ || true
          git config user.name "analisi"; git config user.email "analisi@users.noreply.github.com"
          git checkout --orphan analisi-risultati
          git rm -rf . -q
          cp /tmp/out/* . || true
          git add -A
          git commit -q -m "Risultati analisi"
          git push -f origin analisi-risultati
