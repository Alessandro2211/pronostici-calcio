name: Aggiorna e pubblica

on:
  schedule:
    - cron: '*/5 * * * *'    # ogni 5 minuti: calendario e risultati; la classifica si rinnova ogni 30 minuti
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scarica i dati aggiornati
        env:
          FORCE_FULL: ${{ github.event_name == 'push' && '1' || '0' }}
        run: node scripts/update.mjs
      - name: Statistiche e quote da football-data.co.uk
        env:
          FORCE_FULL: ${{ github.event_name == 'push' && '1' || '0' }}
        run: node scripts/fd.mjs || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
