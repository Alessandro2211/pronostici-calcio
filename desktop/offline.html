<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pronostici Calcio Europa</title>
<style>
  :root{color-scheme:light dark}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:#07161A;color:#E6F1EE;font-family:'Segoe UI',system-ui,sans-serif;text-align:center}
  main{max-width:420px}
  h1{font-size:1.6rem;margin:0 0 10px}
  p{margin:0;color:#8BA7A8;line-height:1.5}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#FFB63D;margin-right:8px;animation:b 1.4s steps(2,start) infinite}
  @keyframes b{to{visibility:hidden}}
  @media (prefers-reduced-motion:reduce){.dot{animation:none}}
</style>
</head>
<body>
<main>
  <h1>Nessuna connessione</h1>
  <p><span class="dot"></span>Non riesco a raggiungere i dati aggiornati. Controllo la connessione e riprovo da solo ogni pochi secondi.</p>
</main>
</body>
</html>
